# Publishes the GitHub release's version to npm through trusted publishing (OIDC): npmjs.com trusts this repository's
# publish.yml (package settings → Trusted Publisher, with `npm publish` allowed), the job proves who it is with
# GitHub's id-token, and npm adds a provenance attestation. No token anywhere. (0.1.0 and 0.1.1 used a short-lived
# token: npm lets a trusted publisher be configured only on a package that already exists.)
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing: the OIDC token npm exchanges for a one-off publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches in a release job: a cache written by another workflow run could slip code into the published package.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (no version given: reads "packageManager": "bun@x.y.z")
        with:
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run prepublishOnly
      # The tag is the version: v0.1.2 publishes package.json's 0.1.2, and a mismatch stops here.
      - run: test "v$(node -p "require('./package.json').version")" = "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      # Trusted publishing needs npm 11.5.1 or later; this exact npm runs the publish, not whatever the Node release
      # bundles.
      - run: npx --yes npm@11.6.2 publish --access public
